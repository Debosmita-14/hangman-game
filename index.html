<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the hangman parts to have a smooth transition */
        .hangman-part {
            stroke: #334155; /* slate-700 */
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .hangman-part.visible {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 text-center">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700 mb-2">Hangman Game</h1>
        <p class="text-slate-500 mb-6">Guess the fruit name before the man is hanged!</p>

        <!-- Hangman Drawing and Word Display -->
        <div class="flex flex-col md:flex-row items-center justify-around gap-8 mb-6">
            <!-- Hangman SVG -->
            <div class="w-48 h-64">
                <svg viewBox="0 0 200 250" class="w-full h-full">
                    <!-- Gallows -->
                    <line x1="20" y1="230" x2="100" y2="230" class="hangman-part visible" /> <!-- Base -->
                    <line x1="60" y1="230" x2="60" y2="20" class="hangman-part visible" />  <!-- Pole -->
                    <line x1="60" y1="20" x2="140" y2="20" class="hangman-part visible" />  <!-- Beam -->
                    <line x1="140" y1="20" x2="140" y2="50" class="hangman-part visible" /> <!-- Rope -->
                    
                    <!-- Body Parts -->
                    <circle id="head" cx="140" cy="70" r="20" class="hangman-part" />
                    <line id="body" x1="140" y1="90" x2="140" y2="150" class="hangman-part" />
                    <line id="left-arm" x1="140" y1="110" x2="110" y2="130" class="hangman-part" />
                    <line id="right-arm" x1="140" y1="110" x2="170" y2="130" class="hangman-part" />
                    <line id="left-leg" x1="140" y1="150" x2="110" y2="180" class="hangman-part" />
                    <line id="right-leg" x1="140" y1="150" x2="170" y2="180" class="hangman-part" />
                </svg>
            </div>

            <!-- Game Info -->
            <div class="flex flex-col items-center justify-center">
                <div id="word-display" class="flex gap-2 md:gap-3 text-3xl md:text-4xl font-bold tracking-widest mb-6">
                    <!-- Blanks will be generated here -->
                </div>
                <p class="text-lg text-slate-600">
                    Incorrect Guesses: <span id="lives-display" class="font-bold">0 / 6</span>
                </p>
            </div>
        </div>

        <!-- Keyboard -->
        <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-2 max-w-lg mx-auto mb-4">
            <!-- Keyboard buttons will be generated here -->
        </div>

        <!-- Game Status Message and Play Again Button -->
        <div id="game-status" class="h-16 flex flex-col items-center justify-center">
             <p id="message" class="text-xl font-semibold h-8"></p>
             <button id="play-again" class="hidden bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-700 transition-colors">Play Again</button>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const wordDisplay = document.getElementById('word-display');
        const livesDisplay = document.getElementById('lives-display');
        const keyboard = document.getElementById('keyboard');
        const messageEl = document.getElementById('message');
        const playAgainBtn = document.getElementById('play-again');
        const hangmanParts = document.querySelectorAll('.hangman-part');

        // --- Game Variables ---
        const wordList = ["APPLE", "BANANA", "CHERRY", "DATE", "ELDERBERRY", "FIG", "GRAPE", "HONEYDEW", "KIWI", "LEMON"];
        const maxIncorrectGuesses = 6;
        
        let secretWord = '';
        let guessedLetters = [];
        let incorrectGuesses = 0;
        let gameIsOver = false;

        // --- Functions ---

        /**
         * Initializes or resets the game state.
         */
        function initGame() {
            // Reset game state
            gameIsOver = false;
            guessedLetters = [];
            incorrectGuesses = 0;
            secretWord = wordList[Math.floor(Math.random() * wordList.length)];

            // Reset UI
            messageEl.textContent = '';
            playAgainBtn.classList.add('hidden');
            updateLivesDisplay();
            
            // Reset hangman drawing
            const bodyParts = ['head', 'body', 'left-arm', 'right-arm', 'left-leg', 'right-leg'];
            bodyParts.forEach(partId => {
                document.getElementById(partId).classList.remove('visible');
            });

            // Create word display with blanks
            wordDisplay.innerHTML = secretWord
                .split('')
                .map(() => `<span class="border-b-4 border-slate-400 w-8 h-10 text-center"></span>`)
                .join('');

            // Create and enable keyboard
            createKeyboard();
        }

        /**
         * Generates the on-screen keyboard buttons.
         */
        function createKeyboard() {
            keyboard.innerHTML = ''; // Clear previous keyboard
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
                const button = document.createElement('button');
                button.textContent = letter;
                button.classList.add('p-2', 'sm:p-3', 'bg-slate-200', 'rounded-md', 'font-semibold', 'hover:bg-slate-300', 'transition-colors', 'disabled:bg-slate-400', 'disabled:text-white', 'disabled:opacity-70');
                button.addEventListener('click', () => handleGuess(letter));
                keyboard.appendChild(button);
            });
        }

        /**
         * Handles the logic when a user guesses a letter.
         * @param {string} letter - The letter guessed by the user.
         */
        function handleGuess(letter) {
            if (gameIsOver || guessedLetters.includes(letter)) {
                return; // Do nothing if game is over or letter was already guessed
            }

            guessedLetters.push(letter);
            
            // Disable the clicked keyboard button
            const buttons = keyboard.getElementsByTagName('button');
            for (let btn of buttons) {
                if (btn.textContent === letter) {
                    btn.disabled = true;
                    break;
                }
            }

            if (secretWord.includes(letter)) {
                // Correct guess
                updateWordDisplay();
                checkWinCondition();
            } else {
                // Incorrect guess
                incorrectGuesses++;
                updateLivesDisplay();
                drawHangmanPart();
                checkLoseCondition();
            }
        }
        
        /**
         * Updates the word display to reveal correctly guessed letters.
         */
        function updateWordDisplay() {
            const spans = wordDisplay.children;
            secretWord.split('').forEach((char, index) => {
                if (guessedLetters.includes(char)) {
                    spans[index].textContent = char;
                }
            });
        }

        /**
         * Updates the display for incorrect guesses.
         */
        function updateLivesDisplay() {
            livesDisplay.textContent = `${incorrectGuesses} / ${maxIncorrectGuesses}`;
        }

        /**
         * Makes the next part of the hangman visible.
         */
        function drawHangmanPart() {
            const bodyParts = ['head', 'body', 'left-arm', 'right-arm', 'left-leg', 'right-leg'];
            if (incorrectGuesses > 0 && incorrectGuesses <= bodyParts.length) {
                document.getElementById(bodyParts[incorrectGuesses - 1]).classList.add('visible');
            }
        }

        /**
         * Checks if the player has won the game.
         */
        function checkWinCondition() {
            const isWon = secretWord.split('').every(letter => guessedLetters.includes(letter));
            if (isWon) {
                endGame(true);
            }
        }

        /**
         * Checks if the player has lost the game.
         */
        function checkLoseCondition() {
            if (incorrectGuesses >= maxIncorrectGuesses) {
                endGame(false);
            }
        }

        /**
         * Ends the game, displaying a win/loss message and the play again button.
         * @param {boolean} didWin - True if the player won, false otherwise.
         */
        function endGame(didWin) {
            gameIsOver = true;
            if (didWin) {
                messageEl.textContent = 'Congratulations! You won!';
                messageEl.classList.add('text-green-600');
                messageEl.classList.remove('text-red-600');
            } else {
                messageEl.textContent = `Game Over! The word was: ${secretWord}`;
                messageEl.classList.add('text-red-600');
                messageEl.classList.remove('text-green-600');
                // Reveal the full word
                const spans = wordDisplay.children;
                secretWord.split('').forEach((char, index) => {
                    spans[index].textContent = char;
                });
            }
            playAgainBtn.classList.remove('hidden');
            // Disable all keyboard buttons
            const buttons = keyboard.getElementsByTagName('button');
            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        // --- Event Listeners ---
        playAgainBtn.addEventListener('click', initGame);

        // --- Initial Game Start ---
        initGame();
    </script>
</body>
</html>
